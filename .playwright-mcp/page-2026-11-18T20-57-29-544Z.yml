        - paragraph [ref=f2e24]: "Vivemos em um tempo marcado por velocidade, excesso de estímulos e múltiplas exigências. Muitas pessoas seguem suas rotinas, cumprem responsabilidades e alcançam objetivos, mas carregam dentro de si uma sensação difícil de nomear: cansaço, inquietação ou perda de sentido."
        - paragraph [ref=f2e25]: Em meio à hiperconectividade e à pressão constante por desempenho, a vida interior muitas vezes é silenciada. E, quando isso acontece, o sofrimento deixa de ser apenas um desconforto passageiro e passa a se manifestar como desconexão, vazio ou repetição de padrões.
